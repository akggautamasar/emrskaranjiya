<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Salary Review Portal{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
<nav class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-10">
  <a href="/" class="font-semibold tracking-tight">Salary Review Portal</a>
  <a href="/admin" class="text-sm text-slate-300 hover:text-white">Admin</a>
</nav>
<main class="max-w-3xl mx-auto p-4 pb-16">
{% block content %}{% endblock %}
</main>
<footer class="text-center text-xs text-slate-400 pb-6">
  Made with ❤️ by Akggautam
</footer>
</body>
</html>
