<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EMRS Karanjiya{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          display: ['Poppins', 'ui-sans-serif', 'system-ui'],
        },
        colors: {
          brand: {
            50: '#eef4ff', 100: '#dbe6ff', 200: '#bccffd', 300: '#8fabfa',
            400: '#5c80f4', 500: '#3a5cec', 600: '#2a3fd9', 700: '#2432b0',
            800: '#212c8c', 900: '#1e2870', 950: '#141a45',
          },
          gold: { 400: '#f2c94c', 500: '#e5b325' },
        },
      },
    },
  }
</script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui; }
  .font-display { font-family: 'Poppins', ui-sans-serif, system-ui; }
  .bg-mesh {
    background-color: #f4f6fb;
    background-image:
      radial-gradient(at 0% 0%, rgba(58,92,236,0.08) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(229,179,37,0.10) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(58,92,236,0.06) 0px, transparent 50%);
  }
</style>
</head>
<body class="bg-mesh min-h-screen text-slate-800">
<nav class="bg-gradient-to-r from-brand-950 via-brand-900 to-brand-800 text-white px-4 py-3.5 flex items-center justify-between sticky top-0 z-20 shadow-lg shadow-brand-900/20">
  <a href="/" class="flex items-center gap-2.5 group">
    <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-gold-400 to-gold-500 flex items-center justify-center text-lg shadow-sm shrink-0">🎓</span>
    <span class="leading-tight">
      <span class="block font-display font-semibold tracking-tight text-[15px] group-hover:text-brand-100">EMRS Karanjiya</span>
      <span class="block text-[11px] text-brand-200/80 -mt-0.5">Salary Review Portal</span>
    </span>
  </a>
  <a href="/admin" class="text-sm text-brand-200 hover:text-white border border-white/15 hover:border-white/30 rounded-lg px-3 py-1.5 transition">Admin</a>
</nav>
<main class="max-w-3xl mx-auto p-4 pb-16">
{% block content %}{% endblock %}
</main>
<footer class="text-center text-xs text-slate-400 pb-6">
  Made with ❤️ by Akggautam
</footer>
</body>
</html>
