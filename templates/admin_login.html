{% extends "base.html" %}
{% block title %}Admin Login — EMRS Karanjiya{% endblock %}
{% block content %}
<div class="mt-6 sm:mt-14 max-w-sm mx-auto">
  <div class="text-center mb-6">
    <span class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-900 to-brand-700 items-center justify-center text-2xl shadow-lg shadow-brand-900/20 mb-3">🔐</span>
    <h1 class="font-display text-2xl font-semibold text-slate-800">Admin Login</h1>
    <p class="text-sm text-slate-500 mt-1">EMRS Karanjiya Salary Portal</p>
  </div>
  <div class="bg-white/90 backdrop-blur rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-6">
    {% if error %}
    <div class="mb-4 rounded-lg bg-red-50 text-red-700 text-sm px-3 py-2 border border-red-200">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required autofocus
          class="w-full rounded-xl border border-slate-300 px-3.5 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-brand-700 to-brand-600 text-white rounded-xl py-3 font-medium shadow-md shadow-brand-900/20 hover:shadow-lg hover:from-brand-800 hover:to-brand-700 transition">
        Log In
      </button>
    </form>
  </div>
</div>
{% endblock %}
