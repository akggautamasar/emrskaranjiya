{% extends "base.html" %}
{% block title %}Check Your Salary{% endblock %}
{% block content %}
<div class="mt-10 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
  <h1 class="text-xl font-semibold mb-1">Check Your Salary Slip</h1>
  <p class="text-sm text-slate-500 mb-6">Enter your Employee ID to view this month's salary details.</p>

  {% if error %}
  <div class="mb-4 rounded-lg bg-red-50 text-red-700 text-sm px-3 py-2 border border-red-200">{{ error }}</div>
  {% endif %}

  <form method="post" action="/lookup" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Employee ID</label>
      <input type="text" name="emp_id" required autofocus
        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-slate-900"
        placeholder="e.g. 240801595">
    </div>
    <button type="submit"
      class="w-full bg-slate-900 text-white rounded-lg py-2.5 font-medium hover:bg-slate-800">
      View My Salary
    </button>
  </form>
</div>
{% endblock %}
